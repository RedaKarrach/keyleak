[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keyleak"
version = "0.1.0"
description = "Incident response for a leaked AWS access key: what did the attacker do, and what is still running."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["aws", "security", "incident-response", "cloudtrail", "leaked-credentials"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "boto3>=1.34",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://redakarrach.github.io/keyleak/"
Repository = "https://github.com/RedaKarrach/keyleak"
Documentation = "https://redakarrach.github.io/keyleak/"

[project.scripts]
keyleak = "keyleak.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
