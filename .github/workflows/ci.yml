name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install (exact versions from uv.lock)
        run: uv sync --locked --extra dev
      - name: Test (no AWS account needed; everything is stubbed)
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1
        run: uv run pytest
      - name: CLI smoke test
        run: |
          uv run keyleak --help
          uv run keyleak investigate --help
          uv run keyleak sweep --help
          uv run keyleak contain --help
          uv run keyleak report --help
