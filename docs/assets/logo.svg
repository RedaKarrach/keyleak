<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="keyleak logo: a cracked key, leaking">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="#040604"/>

  <!-- the key -->
  <g stroke="#39ff8a" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <circle cx="74" cy="96" r="34" fill="#0b1a0f" stroke-width="9"/>
    <circle cx="74" cy="96" r="10" fill="#040604" stroke-width="6"/>
    <path d="M108 96 H214" stroke-width="13" fill="none"/>
    <path d="M190 96 V120 M212 96 V128" stroke-width="11" fill="none"/>
  </g>
  <!-- the crack -->
  <path d="M150 84 L158 96 L148 104 L160 110" fill="none" stroke="#040604" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- leaking -->
  <g fill="#39ff8a" filter="url(#glow)">
    <path d="M156 126 c-7 11 -7 18 0 18 c7 0 7 -7 0 -18z"/>
    <path d="M158 160 c-5 8 -5 13 0 13 c5 0 5 -5 0 -13z" opacity="0.75"/>
    <circle cx="160" cy="192" r="4" opacity="0.5"/>
  </g>
</svg>
